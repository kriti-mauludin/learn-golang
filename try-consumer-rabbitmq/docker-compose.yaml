version: "3.7"
services:
  skeleton-api-dev:
    container_name: try-consumer-rabbitmq
    image: try-consumer-rabbitmq-api:1.0.1
    ports:
      - 8760:7011
    env_file:
      - ./.env
    network_mode: bridge

  skeleton-worker-log:
    container_name: try-consumer-rabbitmq-worker-log
    image: try-consumer-rabbitmq-worker:1.0.1
    env_file:
      - ./.env
    command: [ "log.insert" ]
    network_mode: bridge

  skeleton-worker-example:
    container_name: try-consumer-rabbitmq-worker-example
    image: try-consumer-rabbitmq-worker:1.0.1
    env_file:
      - ./.env
    command: [ "example.consumer" ]
    network_mode: bridge
